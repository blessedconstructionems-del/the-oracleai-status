<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The Oracle AI — Temporarily Unavailable</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b14;
      color: #f7f9fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(76, 110, 245, .18), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(126, 87, 194, .18), transparent 35%),
        #070b14;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      background: rgba(15, 22, 37, .88);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36);
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 196, 61, .32);
      border-radius: 999px;
      color: #ffd978;
      background: rgba(255, 196, 61, .08);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffc43d;
      box-shadow: 0 0 0 5px rgba(255, 196, 61, .12);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1.04;
      letter-spacing: -.04em;
    }

    p {
      max-width: 520px;
      margin: 24px auto 0;
      color: #b9c2d3;
      font-size: clamp(17px, 2.4vw, 20px);
      line-height: 1.65;
    }

    small {
      display: block;
      margin-top: 34px;
      color: #7f8ba1;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span>Service interruption</div>
    <h1>Our servers are temporarily unavailable.</h1>
    <p>We’re working urgently to restore service. Please check back shortly.</p>
    <small>The Oracle AI</small>
  </main>
</body>
</html>
